org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
android.nonTransitiveRClass=true
# Phase C: R8 full mode (default since AGP 8.0, but explicit for clarity).
# Enables more aggressive optimizations + stricter reflection handling.
android.enableR8.fullMode=true
# Phase C: optimized resource shrinking (AGP 8.0+).
# Integrates resource shrinking directly into R8's pipeline — one production
# app reported 25.1 MB -> 13.2 MB with this single flag.
android.r8.optimizedResourceShrinking=true
