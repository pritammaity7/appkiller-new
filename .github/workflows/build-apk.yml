name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Grant the auto-provided GITHUB_TOKEN permission to create releases.
    # Without this, softprops/action-gh-release fails with 403
    # "Resource not accessible by integration".
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      # Phase C: build BOTH debug and release APKs.
      # Release is signed with the debug keystore (configured in build.gradle.kts)
      # so CI can build it without needing a real release keystore. Release is
      # minified + resource-shrunk, so it's much smaller than debug.
      - name: Build Debug + Release APKs with Gradle
        working-directory: android
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-controller-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-controller-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Print APK sizes
        working-directory: android
        run: |
          echo "=== APK sizes ==="
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk 2>/dev/null
          echo "=== Done ==="

      # Publish a GitHub Release with the APKs attached.
      # GitHub Actions artifacts require login to download, but GitHub Releases
      # allow ANONYMOUS downloads — this is what makes the APK accessible to
      # normal users without a GitHub account.
      # Uses GITHUB_TOKEN (auto-provided by Actions) — no setup needed.
      # Only runs on pushes to main (not PRs), so PR builds don't create releases.
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Force Stop Build #${{ github.run_number }}
          body: |
            Auto-built from commit ${{ github.sha }}

            **Downloads (no login required):**
            - `app-release.apk` — recommended for end users (minified, ~1.5 MB)
            - `app-debug.apk` — for development (~9 MB)

            **Install:**
            1. Download `app-release.apk` below.
            2. Enable "Install unknown apps" for your browser/file manager.
            3. Tap the APK to install.
            4. Open Force Stop → enable Accessibility + Usage Access.
            5. Select apps → tap "Force Stop".
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
